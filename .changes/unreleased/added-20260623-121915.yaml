kind: added
body: Add `advanced_connector_policies_only`, `content_security_policy` and `advanced_connector_policies` rules to `powerplatform_environment_group_rule_set`. These rules are served by the rule-based policies API while the existing rules continue to use the rule sets API. An existing policy already assigned to the environment group is adopted rather than replaced.
