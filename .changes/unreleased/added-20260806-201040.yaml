kind: added
body: 'Added `powerplatform_rbac_role_assignment` resource to assign a Power Platform role to an enterprise application, user or group. The required `scope_type` names where it applies: `tenant`, `environment` with `environment_id`, or `environment_group` with `environment_group_id`. The role is selected by `role_definition_id` or `role_definition_name`'
