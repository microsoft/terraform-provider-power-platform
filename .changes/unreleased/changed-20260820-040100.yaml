body: '`powerplatform_role_assignment` is renamed to `powerplatform_security_role_assignment`, and its `principal_id` becomes `system_user_id`. It assigns a Dataverse security role to a Dataverse `systemuserid`, which is a different identifier space from the Entra object id the platform RBAC resource takes.'
