kind: added
body: Add `powerplatform_security_role_assignment` resource for assigning a Dataverse security role to a user, application user or team, independently of the principal's lifecycle. Set `system_user_id` or `team_id` for the principal, and `security_role_name` or `security_role_id` for the role
